name: moona
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.2+25

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  flutter_native_splash: ^2.4.7
  salomon_bottom_bar: ^3.3.2
  animated_bottom_navigation_bar: ^1.3.3
  carousel_slider: ^5.0.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  badges: ^3.1.2
  flutter_svg: ^2.2.0
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2
  flutter_local_notifications: ^18.0.1
  firebase_messaging: ^15.1.6
  firebase_core: ^3.9.0
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  bloc: ^9.0.0
  http: ^1.4.0
  flutter_bloc: ^9.1.1
  flutter_staggered_animations: ^1.1.1
  country_code_picker: ^3.4.1
  flutter_inappwebview: ^6.0.0
  uuid: ^4.0.0
  change_app_package_name: ^1.5.0
  flutter_datetime_picker_plus: ^2.2.0
  connectivity_plus: ^6.0.3
  moyasar: ^3.0.0
  url_launcher: ^6.2.6

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo-ios.png
  android: true
  ios: true
  android_12:
    color: "#ffffff"
    image: assets/images/logo-white.png

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/gifs/
    - assets/fonts/

  fonts:
    - family: DINNextLT
      fonts:
        - asset: assets/fonts/DINNextLT-Regular.ttf
