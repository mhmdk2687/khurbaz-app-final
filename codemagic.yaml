workflows:
  ios-workflow:
    name: iOS Workflow

    environment:
      flutter: 3.32.8
      xcode: 16.2
      cocoapods: 1.15.2

    scripts:
      - name: Clean project
        script: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ~/Library/Caches/CocoaPods
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          flutter pub get

      - name: Install Pods (fix Google Maps issue)
        script: |
          cd ios
          pod deintegrate || true
          pod cache clean --all
          pod repo update
          pod install --repo-update --clean-install
          cd ..

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
