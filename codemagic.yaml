workflows:
  ios-workflow:
    name: iOS Workflow

    environment:
      flutter: 3.32.8
      xcode: 16.2

    scripts:
      - name: Clean Flutter
        script: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          flutter pub get

      - name: Install Pods
        script: |
          cd ios
          pod deintegrate
          pod repo update
          pod install --repo-update
          cd ..

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
